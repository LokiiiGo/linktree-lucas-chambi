<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree - Lucas Chambi</title>
    <meta name="description" content="Links do Lokiii">
    <link rel="icon" type="apple-touch-icon" href="./image/willow-angry-birds.png" />

    <!-- ícones do Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <!-- fonte Oswald do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/linktree.css">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- script de copiar -->
    <script src="./js/copiarTexto.js" defer></script>

    <!-- particles.js -->
    <!-- <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script> -->
    <!-- <script src="./js/particulas.js" defer></script> -->

</head>

<body class="bg-animated text-center oswald min-h-screen flex flex-col items-center p-1 relative overflow-x-hidden">

    <!-- Container das partículas (fica atrás do conteúdo) -->
    <!-- <div id="particles-js" aria-hidden="true"></div> -->

    <main class="w-full max-w-sm md:max-w-md lg:max-w-lg z-10 animate-fade-up">

        <!-- Foto de perfil -->
        <div class="relative inline-block mt-8 mb-4">
            <div class="rounded-full absolute -inset-1 bg-white blur opacity-30 animate-pulse"></div>
            <img src="./image/willow-angry-birds.png" alt="Willow, pesonagem de Angry Birds."
                class="rounded-full relative mx-auto w-40 h-40 object-cover border-2 border-white shadow-2xl"
                width="140" height="140">
        </div>

        <!-- Quem eu sou -->
        <h1 class="font-extrabold text-white text-4xl mt-4 mb-1 tracking-wider uppercase">Lokiii</h1>
        <p class="font-light text-white text-xl mb-4 italic">Freelancer Web | Fã de Fighting Games</p>

        <hr class="border-t border-white w-1/2 mx-auto mb-6">

        <!-- Links -->
        <div class="flex flex-col items-center space-y-4">
            <a href="https://github.com/LokiiiGo" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-github text-2xl"></i>
                <span class="grow">GitHub</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://instagram.com/lokiii.chr" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-instagram text-2xl"></i>
                <span class="grow">Instagram</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <button id="lokiiiChr" data-copy="lokiii.chr" onclick="copiarTexto()" aria-label="Copiar usuário do Discord"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white cursor-pointer font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-discord text-2xl"></i>
                <span class="grow">lokiii.chr</span>
                <i class="bi bi-clipboard opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </button>

            <a href="https://steamcommunity.com/id/lokiiibh/" target="_blank" rel="noopener noreferrer"
                aria-label="Steam"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-steam text-2xl"></i>
                <span class="grow">Steam</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://x.com/LokiiiBH" target="_blank" rel="noopener noreferrer" aria-label="Twitter"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-twitter-x text-2xl"></i>
                <span class="grow">Twitter</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>
        </div>

        <!-- Links da Organização Strawberry Tea -->
        <p class="font-bold text-white text-lg mb-4 italic mt-10">Strawberry Tea - Organização de Brawlhalla</p>

        <hr class="border-t border-white w-1/2 mx-auto mb-6" />

        <div class="flex flex-col items-center space-y-4">
            <a href="https://discord.gg/dgWWEvJaHd" target="_blank" rel="noopener noreferrer"
                aria-label="Discord da Strawberry Tea"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-discord text-2xl"></i>
                <span class="grow">Discord</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://twitter.com/LokiiiGo" target="_blank" rel="noopener noreferrer"
                aria-label="Twitter da Strawberry Tea"
                class="group w-full max-w-xs flex items-center justify-between gap-2 bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-black hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <i class="bi bi-twitter-x text-2xl"></i>
                <span class="grow">Twitter</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>
        </div>
    </main>

    <!-- Rodapé: o ano é preenchido automaticamente -->
    <footer class="text-white mt-auto py-6 text-xs uppercase z-10">
        <script>
            document.querySelector('footer').innerHTML = `
            &copy; ${new Date().getFullYear()} Linktree do Lucas Chambi.`;
        </script>
    </footer>
</body>

</html>
