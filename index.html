<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="apple-touch-icon" href="images/angry-birds-poppy.jpg">
    <title>Linktree - Lucas Chambi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="animacao.css">
</head>

<body class="bg-animated text-center figtree min-h-screen flex flex-col items-center p-1 relative overflow-x-hidden">

    <!--Adicionado circulos de diferentes tamanhos para criar uma animação no background-->
    <ul class="circles">
        <li style="left: 25%; width: 80px; height: 80px; animation-delay: 0s;"></li>
        <li style="left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s;"></li>
        <li style="left: 70%; width: 20px; height: 20px; animation-delay: 4s;"></li>
        <li style="left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s;"></li>
        <li style="left: 65%; width: 20px; height: 20px; animation-delay: 0s;"></li>
        <li style="left: 75%; width: 110px; height: 110px; animation-delay: 3s;"></li>
    </ul>

    <main class="w-full max-w-sm md:max-w-md lg:max-w-lg z-10">

        <!--Foto de perfil-->
        <div class="relative inline-block mt-8 mb-4">
            <div class="absolute -inset-1 bg-white rounded-3xl blur opacity-30 animate-pulse"></div>
            <img src="image/angry-birds-poppy.jpg" alt="Poppy"
                class="relative mx-auto w-35 h-35 object-cover border-2 border-white shadow-3xl">
        </div>

        <!--Quem sou eu-->
        <h1 class="font-extrabold text-white text-4xl mt-4 mb-1 tracking-wider uppercase">Lokiii</h1>
        <p class="font-light text-white text-lg mb-4 italic">Freelancer Web | Fã de Fighting Games</p>

        <!--Uma linha com cor-->
        <hr class="border-t border-white w-1/2 mx-auto mb-6">

        <!--Links-->
        <div class="flex flex-col items-center space-y-4">

            <a href="https://github.com/LokiiiGo" target="_blank"
                class="group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-github text-2xl"></i>
                <span class="flex-grow">Github</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://x.com/LokiiiBH/" target="_blank"
                class="group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-twitter-x text-2xl"></i>
                <span class="flex-grow">Twitter</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://www.instagram.com/lokiii.chr/" target="_blank"
                class="group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-instagram text-2xl"></i>
                <span class="flex-grow">Instagram</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://steamcommunity.com/profiles/76561199114849732/" target="_blank"
                class="group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-steam text-2xl"></i>
                <span class="flex-grow">Steam</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <button onclick="copiarTexto()"
                class="cursor-pointer group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-discord text-2xl"></i>
                <span class="flex-grow" id="lokiiiGo">lokiii.go</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </button>

            <p class="font-bold text-white text-lg mb-4 italic mt-10">Strawberry Tea - Organização de Brawlhalla
            </p>

            <!--Uma linha com cor-->
            <hr class="border-t border-white w-1/2 mx-auto mb-6">

            <a href="https://x.com/SteaEsports/" target="_blank"
                class="group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-twitter-x text-2xl"></i>
                <span class="flex-grow">Twitter</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

            <a href="https://discord.gg/dgWWEvJaHd" target="_blank"
                class="group w-full max-w-xs flex items-center justify-between bg-white/10 backdrop-blur-md text-white font-bold py-4 px-6 rounded-xl border border-white/20 shadow-xl transition-all duration-300 hover:bg-white hover:text-neutral-950 hover:scale-105 active:scale-95">
                <i class="bi bi-discord text-2xl"></i>
                <span class="flex-grow">Discord</span>
                <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </a>

        </div>
    </main>


    <footer class="mt-auto py-6 text-white text-xs tracking-widest uppercase">
        <script>
            document.querySelector('footer').innerHTML = `&copy; ${new Date().getFullYear()} - Lucas Chambi`;
        </script>
    </footer>

    <script src="copiarTexto.js">
    </script>
</body>

</html>
